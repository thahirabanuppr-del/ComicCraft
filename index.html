<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            color: #4a90e2;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #4a90e2;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to ComicCraft 🎨</h1>
        <p>Your ultimate workspace for writing, designing, and organizing graphic novels and comic books.</p>
        <a href="#" class="btn">Get Started</a>
    </header>
</body>
</html>
